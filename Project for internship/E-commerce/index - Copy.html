<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Product Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="product-container">
    <img src="https://via.placeholder.com/300" alt="Product" class="product-image">

    <div class="product-details">
      <h1 class="product-title">Cool T-Shirt</h1>
      <p class="product-description">High-quality cotton t-shirt with a modern design.</p>
      <p class="product-price">₹599</p>
      
      <button id="addToCartBtn">Add to Cart 🛒</button>
      <p>Cart Items: <span id="cartCount">0</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
