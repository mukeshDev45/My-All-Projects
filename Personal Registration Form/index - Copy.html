<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-card">
        <div class="card-header">
            <i class="fas fa-user-plus"></i>
            <h1>Register</h1>
            <span><i class="fas fa-star" style="color: #f7dc6f;"></i> Teacher's pick</span>
        </div>

        <form id="registrationForm" novalidate>
            <div class="input-group">
                <label for="fullname"><i class="fas fa-user-graduate" style="margin-right: 6px;"></i> Full name</label>
                <div class="icon-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullname" placeholder="e.g. Mukesh Prajapati">
                    <span class="error-message" id="nameError"></span>
                </div>
            </div>

            <div class="input-group">
                <label for="email"><i class="fas fa-envelope" style="margin-right: 6px;"></i> Email address</label>
                <div class="icon-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="student@example.com">
                    <span class="error-message" id="emailError"></span>
                </div>
            </div>

            <div class="input-group">
                <label for="password"><i class="fas fa-lock" style="margin-right: 6px;"></i> Password</label>
                <div class="icon-wrapper">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="error-message" id="passwordError"></span>
                </div>
            </div>

            <div class="input-group">
                <label for="role"><i class="fas fa-briefcase" style="margin-right: 6px;"></i> Role / Department</label>
                <div class="icon-wrapper">
                    <i class="fas fa-graduation-cap"></i>
                    <select id="role">
                        <option value="">– Select –</option>
                        <option value="student">🎓 Student</option>
                        <option value="teacher">👨‍🏫 Teacher</option>
                        <option value="staff">📋 Staff</option>
                        <option value="other">🌟 Other</option>
                    </select>
                    <span class="error-message" id="roleError"></span>
                </div>
            </div>

            <div class="inline-group">
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> <i class="fas fa-mars"></i> Male</label>
                    <label><input type="radio" name="gender" value="female"> <i class="fas fa-venus"></i> Female</label>
                    <label><input type="radio" name="gender" value="other"> <i class="fas fa-genderless"></i> Other</label>
                </div>
                <span class="error-message" id="genderError"></span>
                <div class="terms">
                    <input type="checkbox" id="termsCheck">
                    <label for="termsCheck" style="color: #d4e2ed; font-size: 0.85rem;">I agree</label>
                </div>
                <span class="error-message" id="termsError"></span>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> Register now
            </button>
        </form>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="modal-title">Registration Successful! 🎉</h2>
            <p class="modal-message" id="modalMessage">Welcome, Mukesh Prajapati!</p>
            <p class="modal-sub">You have successfully registered.</p>
            <button class="modal-btn" onclick="closeModal()">
                <i class="fas fa-thumbs-up"></i> Awesome!
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
