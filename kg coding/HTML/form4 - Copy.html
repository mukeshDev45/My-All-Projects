<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in HTML 04</title>
</head>
<body>
    <form>
        <label for="male">Male:</label>
        <input type="radio" id="male" name="gender" value="male"><br>
        <label for="female">Female:</label>
        <input type="radio" id="female" name="gender" value="Female"><br>
        <label for="other">Other</label>
        <input type="radio" id="other" name="gender" value="Other"><hr>

    <form>
        <label for="C">C</label>
        <input type="checkbox" name="lang" id="C" value="C"><br>
        <label for="java">Java</label>
        <input type="checkbox" name="lang" id="Java" value="Java"><br>
        <label for="python">Python</label>
        <input type="checkbox" name="lang" id="python" value="python">
    </form><hr>

         <form>
            <label for="country">Select Your Country</label>
            <select name="country" id="country">
                <option value="India">India</option>
                <option value="Us">US</option>
                <option value="Australia">Australia</option>
                <option value="Canada">Canada</option>
                <option value="England">England</option>
                <option value="Russia">Russia</option>
                <option value="New Zealand">New Zealand</option>
                <option value="UAE">UAE</option>
                <option value="other">Other</option>
            </select>
         </form><hr>

         <form>
            <textarea name="story" id="story" cols="20" rows="4">
                Please write a story
            </textarea>
         </form>


    </form>
    
</body>
</html>
